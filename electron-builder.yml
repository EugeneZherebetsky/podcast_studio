appId: org.podcaststudio.installerprototype
productName: Podcast Studio Installer Prototype
directories:
  output: dist-installer
files:
  - apps/desktop/main.mjs
  - apps/desktop/supervisor.mjs
  - apps/desktop/ffmpeg-settings.mjs
  - apps/desktop/key-window.mjs
  - apps/desktop/key-window.html
  - apps/desktop/key-window.js
  - apps/desktop/key-preload.cjs
  - apps/desktop/write-only-store.mjs
  - apps/desktop/local-settings.mjs
extraMetadata:
  main: apps/desktop/main.mjs
extraResources:
  - from: dist-desktop
    to: .
    filter:
      - '**/*'
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
